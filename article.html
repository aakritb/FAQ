<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssurePro Article | AssureOne Help Center</title><meta name="description" content="AssurePro help article"><link rel="stylesheet" href="assets/css/help-center.css?v=20260909-finalfix3"></head>
<body><a class="skip-link" href="#ar-main">Skip to article</a>

<nav class="breadcrumb-wrap"><div class="breadcrumbs page-width" id="breadcrumbs"></div></nav>
<div class="article-shell">
  <aside class="article-side" aria-label="AssurePro topics"><nav class="category-nav" id="category-nav"></nav></aside>

    <section class="related-section" id="related-section" aria-label="Related articles" aria-labelledby="related-heading"><h2 id="related-heading">Continue learning</h2><div class="article-related-list" id="related-list"></div></section>
  </aside>
</div>

<script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script><script src="questions-5.js"></script><script src="questions-6.js"></script><script src="assets/js/taxonomy.js"></script><script src="assets/js/branches.js"></script><script src="assets/js/reviewed-content.js?v=20260909-2"></script><script src="assets/js/help-center.js?v=20260909-finalfix3"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const H=window.HelpCenter,T=window.HelpCenterTaxonomy,B=window.AssureProBranches,A=H.proArticles(),params=new URLSearchParams(location.search),id=params.get('id'),article=A.find(a=>a.id===id)||A[0];
 if(!article){document.getElementById('article-doc').innerHTML='<h1>Article not found</h1><p>Return to the Help Center and choose another article.</p>';return}
 const reviewed=window.ASSUREPRO_REVIEWED_CONTENT?.[article.id],answer=reviewed?.answer||article.answer,home=B.articleHome(article.id),module=home?.module,header=home?.header;
 document.title=`${article.title} | AssureOne Help Center`;document.querySelector('meta[name="description"]').content=article.description||answer;
 const topicItems=header?B.headerArticles(header.id,A):[article];
 const headerHref=header?B.headerUrl(header.id):'category.html',moduleHref=module?B.moduleUrl(module.id):'category.html';
 document.getElementById('breadcrumbs').innerHTML=`<a href="index.html">Help Center</a><span class="slash">/</span>${module?`<a href="${moduleHref}">${H.esc(module.label)}</a><span class="slash">/</span>`:''}${header?`<a href="${headerHref}">${H.esc(header.label)}</a><span class="slash">/</span>`:''}<span class="current">${H.esc(article.title)}</span>`;
 if(module&&header)H.renderBranchTree(document.getElementById('category-nav'),module.id,header.id,article.id,false);else H.renderSidebarTree(document.getElementById('category-nav'),null,null,article.id);
 function mediaBlock(media){if(!media||!media.src)return'';return `<figure class="media-block"><a href="${H.esc(media.src)}" target="_blank"><img src="${H.esc(media.src)}" alt="${H.esc(media.alt||'AssurePro screen')}" loading="lazy"></a>${media.caption?`<figcaption class="media-caption">${H.esc(media.caption)}</figcaption>`:''}</figure>`}
 function listBlock(block,extraClass=''){return `<ul class="detail-list level-${block.level||0}${extraClass?` ${extraClass}`:''}">${block.items.map(item=>`<li>${H.esc(item)}</li>`).join('')}</ul>`}
 function renderBlocks(blocks){let stepNumber=1,out='';for(let i=0;i<blocks.length;i+=1){const block=blocks[i];if(block.type==='paragraph'){out+=`<p>${H.esc(block.text)}</p>`;continue}if(block.type==='list'){out+=listBlock(block);continue}if(block.type==='steps'){const nested=blocks[i+1]?.type==='list'&&Number(blocks[i+1].level)>0?blocks[i+1]:null;out+=`<ol class="steps" start="${stepNumber}">${block.items.map((item,itemIndex)=>{const isLast=itemIndex===block.items.length-1;const nestedHtml=isLast&&nested?listBlock(nested,'step-details'):'';const mediaIndex=stepNumber-1+itemIndex;return `<li data-step="${stepNumber+itemIndex}"><span>${H.esc(item)}${nestedHtml}${mediaBlock(article.media?.steps?.[mediaIndex])}</span></li>`}).join('')}</ol>`;stepNumber+=block.items.length;if(nested)i+=1}}return out}
 function reviewedSections(){const blocks=reviewed?.blocks||[];if(!blocks.length){const legacy=[];(article.more||[]).forEach(item=>legacy.push({type:'paragraph',text:typeof item==='string'?item:(item.lead||item.text||'')}));if(article.steps?.length)legacy.push({type:'heading',text:'Step-by-step'},{type:'steps',items:article.steps});return legacy}return blocks}
 const sections=[];let current={id:'details',title:'',blocks:[]};for(const block of reviewedSections()){if(block.type==='heading'){if(current.blocks.length)sections.push(current);current={id:H.slug(block.text)||`section-${sections.length+1}`,title:block.text,blocks:[]}}else current.blocks.push(block)}if(current.blocks.length)sections.push(current);
 const sectionHtml=sections.map(section=>`<section class="article-section" id="${section.id}">${section.title?`<h2>${H.esc(section.title)}</h2>`:''}${renderBlocks(section.blocks)}</section>`).join('');
 document.getElementById('article-doc').innerHTML=`<div class="article-meta"><span class="meta"><span class="tag">AssurePro</span><span>${article.read} read</span></span></div><h1>${H.esc(article.title)}</h1><div class="article-body"><p class="article-lead">${H.esc(answer)}</p>${mediaBlock(article.media?.overview)}${sectionHtml}${article.note?`<aside class="callout"><strong>Good to know</strong>${H.esc(article.note)}</aside>`:''}</div>`;
 // Related: other articles in the same guide first (excluding this one and
 // current answer), padded out from the wider set if the guide is
 // too small — so a reader never hits a dead end after one answer.
 const exclude=new Set([article.id]);
 let related=topicItems.filter(a=>!exclude.has(a.id)).slice(0,4);
 if(related.length<4){const fill=A.filter(a=>!exclude.has(a.id)&&!related.includes(a)).slice(0,4-related.length);related=related.concat(fill)}
 const relatedSection=document.getElementById('related-section');
 if(related.length){document.getElementById('related-list').innerHTML=related.map(a=>`<a class="article-card" href="${H.articleUrl(a.id)}"><strong>${H.esc(a.title)}</strong></a>`).join('')}else relatedSection.hidden=true;
 document.querySelector('.nav-article.current')?.scrollIntoView({block:'center'});
});
</script></body></html>
