<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssurePro Article | AssureOne Help Center</title><meta name="description" content="AssurePro help article"><link rel="stylesheet" href="assets/css/help-center.css"></head>
<body><a class="skip-link" href="#ar-main">Skip to article</a>

<nav class="breadcrumb-wrap"><div class="breadcrumbs page-width" id="breadcrumbs"></div></nav>
<div class="article-shell">
  <aside class="article-side" aria-label="AssurePro topics"><a class="back-link" href="index.html">← All AssurePro help</a><nav class="category-nav" id="category-nav"></nav></aside>
  <main id="ar-main"><article class="article-doc" id="article-doc"></article><div class="article-footer"><section class="helpful"><p id="feedback-label">Was this article helpful?</p><div class="feedback-buttons"><button type="button" data-feedback="yes">Yes</button><button type="button" data-feedback="no">Not yet</button></div></section><nav class="pager" id="pager" aria-label="Previous and next articles"></nav><section class="related-section" id="related-section" aria-labelledby="related-heading"><h2 id="related-heading">Related articles</h2><div class="article-list" id="related-list"></div></section></div></main>
  <aside class="article-toc" id="article-toc" aria-label="On this page"></aside>
</div>
<footer class="site-footer"><div class="page-width"><span>© 2026 AssureOne Technologies LLC. All rights reserved.</span><span>Need help? <a href="mailto:support@assureone.ai">support@assureone.ai</a></span></div></footer>
<script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script><script src="questions-5.js"></script><script src="questions-6.js"></script><script src="assets/js/taxonomy.js"></script><script src="assets/js/help-center.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const H=window.HelpCenter,T=window.HelpCenterTaxonomy,A=H.proArticles(),id=new URLSearchParams(location.search).get('id'),article=A.find(a=>a.id===id)||A[0];
 if(!article){document.getElementById('article-doc').innerHTML='<h1>Article not found</h1><p>Return to the Help Center and choose another article.</p>';return}
 document.title=`${article.title} | AssureOne Help Center`;document.querySelector('meta[name="description"]').content=article.description||article.answer;
 const guideId=T.guideOfArticle(article.id),guide=guideId&&T.guideById(guideId),collection=guideId&&T.collectionOfGuide(guideId);
 const guideLabel=guide?guide.label:article.category;
 const topicItems=A.filter(a=>T.guideOfArticle(a.id)===guideId),index=topicItems.findIndex(a=>a.id===article.id),previous=topicItems[index-1],next=topicItems[index+1];
 document.getElementById('breadcrumbs').innerHTML=`<a href="index.html">AssureOne Help Center</a><span class="slash">/</span><a href="category.html">AssurePro</a><span class="slash">/</span>${collection?`<a href="${T.collectionUrl(collection.id)}">${H.esc(collection.label)}</a><span class="slash">/</span>`:''}<a href="${guideId?T.guideUrl(guideId):'category.html'}">${H.esc(guideLabel)}</a><span class="slash">/</span><span class="current">${H.esc(article.title)}</span>`;
 H.renderSidebarTree(document.getElementById('category-nav'), guideId, collection?collection.id:null);
 function detail(entry){if(typeof entry==='string')return `<p>${H.esc(entry)}</p>`;if(!entry||typeof entry!=='object')return '';let out='';if(entry.label)out+=`<h2>${H.esc(entry.label)}</h2>`;if(entry.lead)out+=`<p>${H.esc(entry.lead)}</p>`;if(entry.text)out+=`<p>${H.esc(entry.text)}</p>`;if(Array.isArray(entry.list)&&entry.list.length)out+=`<ul class="detail-list">${entry.list.map(i=>`<li>${H.esc(i)}</li>`).join('')}</ul>`;return out}
 function mediaBlock(media){if(!media||!media.src)return'';return `<figure class="media-block"><a href="${H.esc(media.src)}" target="_blank"><img src="${H.esc(media.src)}" alt="${H.esc(media.alt||'AssurePro screen')}" loading="lazy"></a>${media.caption?`<figcaption class="media-caption">${H.esc(media.caption)}</figcaption>`:''}</figure>`}
 const more=(article.more||[]).map(detail).join(''),steps=(article.steps||[]);
 document.getElementById('article-doc').innerHTML=`<div class="article-meta"><span class="meta"><span class="tag">AssurePro</span><a href="${guideId?T.guideUrl(guideId):'category.html'}">${H.esc(guideLabel)}</a><span>·</span><span>${article.read} read</span></span><button class="copy-link" type="button" aria-label="Copy article link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1.5" stroke="currentColor" stroke-width="1.8"/></svg><span>Copy link</span></button></div><h1>${H.esc(article.title)}</h1><div class="article-body"><section id="overview"><h2 class="overline">Overview</h2><p class="article-lead">${H.esc(article.answer)}</p>${mediaBlock(article.media?.overview)}${more}</section>${steps.length?`<section id="how-to"><h2>How to do it</h2><ol class="steps">${steps.map((s,i)=>`<li><span>${H.esc(s)}${mediaBlock(article.media?.steps?.[i])}</span></li>`).join('')}</ol></section>`:''}${article.note?`<aside class="callout"><strong>Good to know</strong>${H.esc(article.note)}</aside>`:''}</div>`;
 const tocSections=[...document.querySelectorAll('.article-body section')],toc=document.getElementById('article-toc');if(tocSections.length>1){toc.innerHTML='<strong>On this page</strong>'+tocSections.map(s=>`<a href="#${s.id}">${s.querySelector('h2')?.textContent||'Section'}</a>`).join('')}else toc.hidden=true;
 document.getElementById('pager').innerHTML=`${previous?`<a href="${H.articleUrl(previous.id)}"><small>← Previous article</small><strong>${H.esc(previous.title)}</strong></a>`:'<span></span>'}${next?`<a href="${H.articleUrl(next.id)}"><small>Next article →</small><strong>${H.esc(next.title)}</strong></a>`:'<span></span>'}`;
 // Related: other articles in the same guide first (excluding this one and
 // the two already shown by the pager), padded out from the wider set if the
 // guide is too small — so a reader never hits a dead end after one answer.
 const exclude=new Set([article.id,previous?.id,next?.id].filter(Boolean));
 let related=topicItems.filter(a=>!exclude.has(a.id)).slice(0,4);
 if(related.length<4){const fill=A.filter(a=>!exclude.has(a.id)&&!related.includes(a)).slice(0,4-related.length);related=related.concat(fill)}
 const relatedSection=document.getElementById('related-section');
 if(related.length){document.getElementById('related-list').innerHTML=related.map(a=>`<a class="article-card" href="${H.articleUrl(a.id)}"><strong>${H.esc(a.title)}</strong></a>`).join('')}else relatedSection.hidden=true;
 document.querySelectorAll('.copy-link').forEach(btn=>btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href)}catch(e){}const s=btn.querySelector('span');s.textContent='Link copied';setTimeout(()=>s.textContent='Copy link',1500)}));
 document.querySelectorAll('[data-feedback]').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('feedback-label').textContent='Thank you — your feedback helps us improve this guidance.';document.querySelector('.feedback-buttons').hidden=true}));
 document.querySelector('.nav-guides a.active')?.scrollIntoView({block:'center'});
});
</script></body></html>
