<script>
document.addEventListener('DOMContentLoaded',()=>{
 const H=window.HelpCenter,T=window.HelpCenterTaxonomy,B=window.AssureProBranches,A=H.proArticles(),params=new URLSearchParams(location.search),id=params.get('id'),article=A.find(a=>a.id===id)||A[0];
 if(!article){document.getElementById('article-doc').innerHTML='<h1>Article not found</h1><p>Return to the Help Center and choose another article.</p>';return}
 const reviewed=window.ASSUREPRO_REVIEWED_CONTENT?.[article.id],answer=reviewed?.answer||article.answer,home=B.articleHome(article.id),module=home?.module,header=home?.header;
 document.title=`${article.title} | AssureOne Help Center`;document.querySelector('meta[name="description"]').content=article.description||answer;
 const topicItems=header?B.headerArticles(header.id,A):[article],index=Math.max(0,topicItems.findIndex(item=>item.id===article.id));
 const headerHref=header?B.headerUrl(header.id):'category.html',moduleHref=module?B.moduleUrl(module.id):'category.html';
 document.getElementById('breadcrumbs').innerHTML=`<a href="index.html">Help Center</a><span class="slash">/</span>${module?`<a href="${moduleHref}">${H.esc(module.label)}</a><span class="slash">/</span>`:''}${header?`<a href="${headerHref}">${H.esc(header.label)}</a><span class="slash">/</span>`:''}<span class="current">${H.esc(article.title)}</span>`;
 const back=document.getElementById('back-link');back.href=headerHref;back.textContent=`← Back to ${header?.label||'AssurePro topics'}`;
 if(module&&header)H.renderBranchTree(document.getElementById('category-nav'),module.id,header.id,article.id);else H.renderSidebarTree(document.getElementById('category-nav'),null,null,article.id);
 function mediaBlock(media){if(!media||!media.src)return'';return `<figure class="media-block"><a href="${H.esc(media.src)}" target="_blank"><img src="${H.esc(media.src)}" alt="${H.esc(media.alt||'AssurePro screen')}" loading="lazy"></a>${media.caption?`<figcaption class="media-caption">${H.esc(media.caption)}</figcaption>`:''}</figure>`}
 function renderBlock(block,stepStart){if(block.type==='paragraph')return `<p>${H.esc(block.text)}</p>`;if(block.type==='list')return `<ul class="detail-list level-${block.level||0}">${block.items.map(item=>`<li>${H.esc(item)}</li>`).join('')}</ul>`;if(block.type==='steps')return `<ol class="steps"${stepStart>1?` start="${stepStart}"`:''}>${block.items.map((item,i)=>`<li><span>${H.esc(item)}${mediaBlock(article.media?.steps?.[i])}</span></li>`).join('')}</ol>`;return ''}
 function reviewedSections(){const blocks=reviewed?.blocks||[];if(!blocks.length){const legacy=[];(article.more||[]).forEach(item=>legacy.push({type:'paragraph',text:typeof item==='string'?item:(item.lead||item.text||'')}));if(article.steps?.length)legacy.push({type:'heading',text:'Step-by-step'},{type:'steps',items:article.steps});return legacy}return blocks}
 const sections=[];let current={id:'details',title:'',blocks:[]};for(const block of reviewedSections()){if(block.type==='heading'){if(current.blocks.length)sections.push(current);current={id:H.slug(block.text)||`section-${sections.length+1}`,title:block.text,blocks:[]}}else current.blocks.push(block)}if(current.blocks.length)sections.push(current);
 // A section's numbered steps may be interrupted by a nested bullet list (e.g. "Filter by
 // product:" followed by the product options); that nested list is supporting detail for the
 // step before it, not a new procedure, so numbering must continue across it rather than
 // restarting at 1 — otherwise a lone trailing step reads as a stray, unexplained "1.".
 const sectionHtml=sections.map(section=>{let stepCount=0;const body=section.blocks.map(block=>{if(block.type==='steps'){const start=stepCount+1;stepCount+=block.items.length;return renderBlock(block,start)}return renderBlock(block)}).join('');return `<section class="article-section" id="${section.id}">${section.title?`<h2>${H.esc(section.title)}</h2>`:''}${body}</section>`}).join('');
 document.getElementById('article-doc').innerHTML=`<div class="article-meta"><span class="meta"><span class="tag">AssurePro</span><a href="${headerHref}">${H.esc(header?.label||article.category)}</a><span>·</span><span>${article.read} read</span></span><button class="copy-link" type="button" aria-label="Copy article link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2 2v1.5" stroke="currentColor" stroke-width="1.8"/></svg><span>Copy link</span></button></div><p class="article-progress">Article ${index+1} of ${topicItems.length} in ${H.esc(header?.label||'AssurePro')}</p><h1>${H.esc(article.title)}</h1><div class="article-body"><p class="article-lead">${H.esc(answer)}</p>${mediaBlock(article.media?.overview)}${sectionHtml}${article.note?`<aside class="callout"><strong>Good to know</strong>${H.esc(article.note)}</aside>`:''}</div>`;
 const observedSections=[...document.querySelectorAll('.article-section')],tocSections=observedSections.filter(section=>section.querySelector('h2')),toc=document.getElementById('article-toc');if(tocSections.length){toc.innerHTML='<strong>On this page</strong>'+tocSections.map(s=>`<a href="#${s.id}">${s.querySelector('h2').textContent}</a>`).join('')}else toc.hidden=true;
 // Related: other articles in the same guide first (excluding this one and
 // current answer), padded out from the wider set if the guide is
 // too small — so a reader never hits a dead end after one answer.
 const exclude=new Set([article.id]);
 let related=topicItems.filter(a=>!exclude.has(a.id)).slice(0,4);
 if(related.length<4){const fill=A.filter(a=>!exclude.has(a.id)&&!related.includes(a)).slice(0,4-related.length);related=related.concat(fill)}
 const relatedSection=document.getElementById('related-section');
 if(related.length){document.getElementById('related-list').innerHTML=related.map(a=>`<a class="article-card" href="${H.articleUrl(a.id)}"><strong>${H.esc(a.title)}</strong></a>`).join('')}else relatedSection.hidden=true;
 document.querySelectorAll('.copy-link').forEach(btn=>btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href)}catch(e){}const s=btn.querySelector('span');s.textContent='Link copied';setTimeout(()=>s.textContent='Copy link',1500)}));
 document.querySelector('.save-pdf')?.addEventListener('click',()=>window.print());
 document.querySelector('.nav-article.current')?.scrollIntoView({block:'center'});
 if('IntersectionObserver'in window){const links=[...toc.querySelectorAll('a')],observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(!visible)return;links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')===`#${visible.target.id}`))},{rootMargin:'-120px 0px -65%'});tocSections.forEach(s=>observer.observe(s))}
});
</script></body></html>
