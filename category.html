<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AssurePro Help | AssureOne</title><link rel="stylesheet" href="assets/css/help-center.css"></head>
<body><a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html" aria-label="AssureOne Help Center home"><img class="brand-logo" src="assets/images/assureone-logo.png" alt="AssureOne" width="149" height="31"><span class="brand-suffix">Help Center</span></a><div class="top-search"><svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2"/></svg><input data-search type="search" placeholder="Search AssurePro help" aria-label="Search AssurePro help"><span class="key-hint">⌘ K</span><div class="search-panel" hidden></div></div><div class="top-actions"><a class="website-link" href="https://assureone.ai/" target="_blank" rel="noopener">Visit our website</a><button class="support-copy" aria-label="Copy support@assureone.ai to clipboard"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1.5" stroke="currentColor" stroke-width="1.8"/></svg><span class="support-label">Contact support</span></button></div></div></header>
<nav class="breadcrumb-wrap"><div class="breadcrumbs page-width" id="breadcrumbs"></div></nav>
<main id="main"><section class="category-hero"><div class="page-width"><p class="overline" id="category-eyebrow">AssurePro guidance</p><h1 id="category-title">AssurePro help</h1><p id="category-description"></p><div class="category-stats" id="category-stats"></div></div></section><div class="category-layout page-width"><nav class="category-nav" aria-label="AssurePro topics"><strong>Browse topics</strong><div id="category-nav"></div></nav><div id="category-content"></div></div></main>
<footer class="site-footer"><div class="page-width"><span>© 2026 AssureOne Technologies LLC. All rights reserved.</span><span>Need help? <a href="mailto:support@assureone.ai">support@assureone.ai</a></span></div></footer>
<script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script><script src="questions-5.js"></script><script src="questions-6.js"></script><script src="assets/js/taxonomy.js"></script><script src="assets/js/help-center.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const H=window.HelpCenter,T=window.HelpCenterTaxonomy,A=H.proArticles(),params=new URLSearchParams(location.search);

 // Journeys are curated, cross-cutting entry points for the homepage — the
 // opposite axis from the permanent feature-based nav. A journey names the
 // guides it pulls together; it does not need to be a whole collection.
 const journeys={
  'firm-admin':{title:'Get started as a firm administrator',description:'Set up your firm, users, services, workflows, portal, and core settings.',guides:['gs-intro','gs-account','gs-navigate','gs-admin-setup','firm-profile','team-roles']},
  'team-member':{title:'Get started as a team member',description:'Learn the workspace, clients, tasks, documents, communications, time tracking, and daily work.',guides:['gs-team-setup','gs-navigate','client-workspace','tasks','doc-workspace','comms-inbox','time-tracking']},
  'clients':{title:'Work with clients',description:'Manage prospects, clients, engagements, documents, communications, engagement letters, and client portal activity.',guides:['prospects','prospect-pipeline','clients','client-workspace','client-portal','doc-workspace']},
  'run-firm':{title:'Run your firm',description:'Manage team capacity, billing, services, reporting, templates, notifications, and administration.',guides:['workload-capacity','billing','service-catalog','reports','templates','notifications-email']},
  'ai':{title:'AI & automation',description:'Use AI Agent, Daily Briefing, AI Credits, reminders, templates, and AI-assisted workflows.',guides:['ai-agent','daily-briefing','ai-credits','automated-reminders']},
  'reference':{title:'Reference & support',description:'Integrations, security, account access, compliance, troubleshooting, FAQs, and support.',guides:['integrations-getting-started','account-security','data-security','compliance','get-support']},
 };

 const guideId=params.get('guide'),collectionId=params.get('collection'),journeyId=params.get('journey'),journey=journeys[journeyId];
 const guide=guideId&&T.guideById(guideId);
 const collection=guide?T.collectionOfGuide(guideId):(collectionId?T.TAXONOMY.find(c=>c.id===collectionId):null);

 function articlesFor(guideIds){return A.filter(a=>guideIds.includes(T.guideOfArticle(a.id)))}
 function card(a){return `<a class="article-card" href="${H.articleUrl(a.id)}"><strong>${H.esc(a.title)}</strong></a>`}
 function guideCard(g,count){return count
   ?`<a class="article-card guide-card" href="${T.guideUrl(g.id)}"><span class="guide-card-icon">${H.topicIcon(g.id)}</span><strong>${H.esc(g.label)}</strong><span class="meta">${count} article${count===1?'':'s'}</span></a>`
   :`<button class="article-card guide-card disabled" data-coming-soon type="button"><span class="soon-dot">Coming soon</span><span class="guide-card-icon">${H.topicIcon(g.id)}</span><strong>${H.esc(g.label)}</strong><span class="meta">Content in review</span></button>`}

 let title,description,crumbTrail,contentHtml;

 if(guide){
  title=guide.label;description=`Practical answers for ${guide.label.toLowerCase()}.`;
  const items=articlesFor([guide.id]);
  crumbTrail=`<a href="${T.collectionUrl(collection.id)}">${H.esc(collection.label)}</a><span class="slash">/</span><span class="current">${H.esc(guide.label)}</span>`;
  document.getElementById('category-eyebrow').textContent=collection.label;
  document.getElementById('category-stats').innerHTML=items.length?`<span>${items.length} article${items.length===1?'':'s'}</span><span>Updated for the current AssurePro experience</span>`:'';
  contentHtml=items.length
   ?`<div class="article-list">${items.map(card).join('')}</div>`
   :`<div class="empty-guide"><strong>This guide is still being written.</strong><p>We are reviewing the answers for “${H.esc(guide.label)}” before publishing them. In the meantime, use search or <a href="mailto:support@assureone.ai">email support</a>.</p></div>`;
 } else if(collection){
  title=collection.label;description='Browse this area of AssurePro by guide.';
  crumbTrail=`<span class="current">${H.esc(collection.label)}</span>`;
  document.getElementById('category-eyebrow').textContent='AssurePro guidance';
  const total=articlesFor(collection.guides.map(g=>g.id)).length;
  document.getElementById('category-stats').innerHTML=`<span>${total} article${total===1?'':'s'}</span><span>${collection.guides.length} guide${collection.guides.length===1?'':'s'}</span>`;
  contentHtml=`<div class="article-list guide-grid">${collection.guides.map(g=>guideCard(g,articlesFor([g.id]).length)).join('')}</div>`;
 } else if(journey){
  title=journey.title;description=journey.description;
  crumbTrail=`<span class="current">${H.esc(journey.title)}</span>`;
  document.getElementById('category-eyebrow').textContent='AssurePro guidance';
  const items=articlesFor(journey.guides);
  document.getElementById('category-stats').innerHTML=`<span>${items.length} article${items.length===1?'':'s'}</span><span>Updated for the current AssurePro experience</span>`;
  contentHtml=journey.guides.map(gid=>{const g=T.guideById(gid);const its=articlesFor([gid]);if(!its.length)return'';return `<section class="article-list-section"><p class="overline">${H.esc(T.collectionOfGuide(gid).label)}</p><h2><span class="section-icon">${H.topicIcon(gid)}</span>${H.esc(g.label)}</h2><div class="article-list">${its.map(card).join('')}</div></section>`}).join('');
 } else {
  title='All AssurePro guidance';description='Browse clear, practical answers for using AssurePro, organized the way the product itself is organized.';
  crumbTrail=`<span class="current">All AssurePro</span>`;
  document.getElementById('category-eyebrow').textContent='AssurePro guidance';
  document.getElementById('category-stats').innerHTML=`<span>${A.length} articles</span><span>${T.TAXONOMY.length} collections</span>`;
  contentHtml=`<div class="article-list guide-grid">${T.TAXONOMY.map(c=>{const n=articlesFor(c.guides.map(g=>g.id)).length;return `<a class="article-card guide-card" href="${T.collectionUrl(c.id)}"><span class="guide-card-icon">${H.topicIcon(c.id)}</span><strong>${H.esc(c.label)}</strong><span class="meta">${n} article${n===1?'':'s'}</span></a>`}).join('')}</div>`;
 }

 document.title=`${title} | AssureOne Help Center`;
 document.getElementById('category-title').textContent=title;
 document.getElementById('category-description').textContent=description;
 document.getElementById('breadcrumbs').innerHTML=`<a href="index.html">AssureOne Help Center</a><span class="slash">/</span><a href="category.html">AssurePro</a><span class="slash">/</span>${crumbTrail}`;
 document.getElementById('category-content').innerHTML=contentHtml;
 H.renderSidebarTree(document.getElementById('category-nav'), guideId, collection?collection.id:null);
});
</script></body></html>
