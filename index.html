<script>

    ['run-firm','briefcase','Run your firm','Track time and billing, manage your team, review reports, and connect your tools.'],
    ['ai-automation','sparkle','Use AI and automation','Use AI Agent, Daily Briefing, AI Credits, and automated reminders.']
  ];
  document.getElementById('journey-grid').innerHTML=journeys.map(j=>`<a class="journey-card" href="category.html?journey=${j[0]}"><span class="journey-icon">${H.icon(j[1])}</span><h3>${j[2]}</h3><p>${j[3]}</p></a>`).join('');
});
